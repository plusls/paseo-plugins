name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - name: Pack plugins
        run: |
          mkdir -p dist
          for dir in plugins/*; do
            plugin=$(basename "$dir")
            pnpm --filter "$plugin" pack --pack-destination "$PWD/dist"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: paseo-plugins-packages
          path: dist/*.tgz
          if-no-files-found: error
          retention-days: 30
